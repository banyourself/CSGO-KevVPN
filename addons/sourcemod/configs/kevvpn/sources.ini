// KevVPN blocklist sources. One URL per line, '#' or '//' comments.
// Each file must be a plain list of CIDR ranges or bare addresses.
// Every URL below was fetched and confirmed to exist and to be in
// that format. A dead URL is logged and the others still load.

// ---- PRIMARY: VPN egress and datacenter ranges ----
// X4BNet/lists_vpn. Plain CIDR, small, actively maintained, and the
// closest free equivalent of udger's paid datacenter database.
// vpn ~3,900 ranges, datacenter ~15,000 ranges.
https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt
https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt

// ---- SUPPLEMENT: tor exits ----
https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/dm_tor.ipset
https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/et_tor.ipset

// ---- PER-ASN: providers the general lists miss ----
// ipverse/asn-ip publishes every announced prefix per ASN as plain
// CIDR. Swap the number for any AS you want covered.
//
// AS13335 Cloudflare. Needed for WARP: its egress lives in 104.28.0.0/16,
// which is NOT in Cloudflare's published CDN list at cloudflare.com/ips-v4
// and is not in the datacenter feed either. No consumer ISP is Cloudflare,
// so blocking this AS only affects WARP users.
https://raw.githubusercontent.com/ipverse/asn-ip/master/as/13335/ipv4-aggregated.txt

